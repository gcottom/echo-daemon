services:
  echo-daemon-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_ONNX: "${ENABLE_ONNX:-0}"
        ORT_VERSION: "${ORT_VERSION:-1.31.1}"
    ports:
      - "127.0.0.1:50999:50999"
    environment:
      ECHO_ADDR: 0.0.0.0:50999
    volumes:
      - ./data:/app/data
      - ./temp:/app/temp
      - ./settings.yaml:/app/config/config.yaml:ro
      - "${MUSIC_ROOT:-./music}:/app/music:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:50999/healthz"]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 30s
